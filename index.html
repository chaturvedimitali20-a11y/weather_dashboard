<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard | SkillMe Week 3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <h1>Weather Dashboard</h1>
      <div class="header-controls">
        <form class="search-form" id="search-form" novalidate>
          <label for="city-input" class="visually-hidden">Search city</label>
          <input
            type="text"
            id="city-input"
            class="search-input"
            placeholder="Enter any city (e.g., Pune, London)..."
            aria-label="Search city"
          />
          <button type="submit" id="search-btn" class="search-btn">Search</button>
        </form>
        <button type="button" id="geo-btn" class="geo-btn" aria-label="Use my current location">
          📍 My Location
        </button>
        <button type="button" id="unit-toggle" class="unit-btn" aria-label="Toggle temperature unit">
          Switch to °F
        </button>
      </div>
    </header>

    <!-- Status / Loading / Error Feedback Banner -->
    <p id="search-message" class="search-message" role="alert" aria-live="polite"></p>

    <!-- Current Weather Card -->
    <section class="current-weather" aria-label="Current weather">
      <div class="current-main">
        <div>
          <h2 class="current-city" id="current-city">Loading...</h2>
          <p class="current-condition" id="current-condition">--</p>
        </div>
        <div class="current-icon" id="current-icon" role="img" aria-label="Weather icon">☀️</div>
      </div>

      <div class="current-stats">
        <p class="current-temp" id="current-temp">--°C</p>
        <div class="current-details">
          <span>💧 Humidity: <strong id="current-humidity">--%</strong></span>
          <span>💨 Wind: <strong id="current-wind">-- km/h</strong></span>
        </div>
      </div>
    </section>

    <!-- 7-Day Forecast Row -->
    <section class="forecast-section" aria-label="7-day forecast">
      <h2 class="section-title">7-Day Forecast</h2>
      <div class="forecast-row" id="forecast-row"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
